spring.application.name=aluguel
server.port=8080

# Os dados do Supabase ficam no arquivo .env (que não vai pro GitHub)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# O Hibernate cria as tabelas sozinho a partir das classes do pacote model
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Chave do token de login (também vem do .env) e endereço do front-end liberado no CORS
jwt.secret=${JWT_SECRET}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
