spring.application.name=aluguel
server.port=8080

# Lê as variáveis do arquivo .env (se existir), para não deixar senhas no código
spring.config.import=optional:file:.env[.properties]

# Conexão com o Supabase (PostgreSQL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate: cria e atualiza as tabelas a partir das entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
