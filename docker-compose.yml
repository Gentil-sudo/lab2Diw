# Ambiente local completo: PostgreSQL + back-end (Spring Boot) + front-end (React servido pelo Nginx).
# Uso: docker compose up --build -d
services:
  db:
    image: postgres:16
    container_name: aluguel-db
    environment:
      POSTGRES_DB: aluguel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aluguel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: aluguel-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/aluguel
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-chave-local-de-desenvolvimento-com-mais-de-32-caracteres}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api
    container_name: aluguel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  dados-postgres:
